name: Проверка линтером

on:
  pull_request:
    branches: ["develop"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Настройка Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Установка и запуск flake8
        run: |
          pip install flake8
          flake8 .
